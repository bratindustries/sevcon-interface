name: Build Windows executable

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Check Python syntax
        run: python -m compileall -q sevcon_ui.py can_adapters.py eds_support.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SevconGen4 sevcon_ui.py
      - name: Check build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/SevconGen4.exe")) { throw "Windows executable not found" }
          Get-Item "dist/SevconGen4.exe" | Select-Object Name, Length
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: SevconGen4-Windows-x64
          path: dist/SevconGen4.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub pre-release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v0.1.0-preview"
          $notes = @"
          Windows x64 preview of Sevcon Gen4 CANopen Utility.

          Features: Ewert CANdapter and GVRET interfaces, diagnostics and active fault decoding, EDS browsing, parameter editing, security authorization interface, and manual parameter store.

          This release is experimental, unsigned, and has NOT been validated against a physical Sevcon motor controller or CAN adapter. Keep propulsion disabled during initial testing.
          "@
          gh release view $tag --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release already exists; retaining its existing tag and assets."
          } else {
            gh release create $tag "dist/SevconGen4.exe" --repo ${{ github.repository }} --target "${{ github.sha }}" --title "Sevcon Gen4 v0.1.0 Preview (Windows x64)" --notes $notes --prerelease
          }
